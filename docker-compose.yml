services:
  kickup-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kickup-api
    restart: unless-stopped
    ports:
      - "4002:3008"
    env_file:
      - .env
    environment:
      NODE_ENV: production
    volumes:
      - uploads_data:/app/uploads
    networks:
      - kickup-network

volumes:
  uploads_data:

networks:
  kickup-network:
    driver: bridge
